---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build core for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (cross-compile ARM from x86)
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-latest

          # macOS builds (native)
          - platform: macos-x86_64
            runner: macos-latest
          - platform: macos-arm64
            runner: macos-latest

          # Windows builds (native)
          - platform: windows-x86_64
            runner: windows-latest

    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Bun
        # v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Cache Bun
        # v5.0.5
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}-${{ matrix.runner }}
          restore-keys: |
            bun-${{ hashFiles('**/bun.lock') }}-${{ matrix.runner }}

      - name: Set version (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux (x86_64)
        if: matrix.platform == 'linux-x86_64'
        run: bun run build:linux-x64

      - name: Build Linux (aarch64)
        if: matrix.platform == 'linux-aarch64'
        run: bun run build:linux-arm64

      - name: Build Darwin (x86_64)
        if: matrix.platform == 'macos-x86_64'
        run: bun run build:darwin-x64

      - name: Build Darwin (arm64)
        if: matrix.platform == 'macos-arm64'
        run: bun run build:darwin-arm64

      - name: Build (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        env:
          KULALA_CURL_PATH: C:\Windows\System32\curl.exe
        run: bun run build:windows-x64

      - name: Upload artifact for windows-x86_64
        if: matrix.platform == 'windows-x86_64'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kulala-core-windows-x86_64.exe
          path: packages/core/dist/kulala-core-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload artifact for linux-x86_64
        if: matrix.platform == 'linux-x86_64'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kulala-core-linux-x86_64
          path: packages/core/dist/kulala-core-linux-x86_64
          if-no-files-found: error

      - name: Upload artifact for linux-aarch64
        if: matrix.platform == 'linux-aarch64'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kulala-core-linux-aarch64
          path: packages/core/dist/kulala-core-linux-aarch64
          if-no-files-found: error

      - name: Upload artifact for darwin-x86_64
        if: matrix.platform == 'macos-x86_64'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kulala-core-darwin-x86_64
          path: packages/core/dist/kulala-core-darwin-x86_64
          if-no-files-found: error

      - name: Upload artifact for darwin-arm64
        if: matrix.platform == 'macos-arm64'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kulala-core-darwin-arm64
          path: packages/core/dist/kulala-core-darwin-arm64
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download all artifacts
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          path: packages/core/dist/
          pattern: kulala-core-*
          merge-multiple: true

      - name: Set version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release with binaries"
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            packages/core/dist/kulala-core-*
