---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build core for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (cross-compile ARM from x86)
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-latest

          # macOS builds (native)
          - platform: macos-x86_64
            runner: macos-latest
          - platform: macos-arm64
            runner: macos-latest

          # Windows builds (native)
          - platform: windows-x86_64
            runner: windows-latest
          # windows-aarch64 not available (no ARM64 Windows runners)

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache Bun
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}-${{ matrix.runner }}
          restore-keys: |
            bun-${{ hashFiles('**/bun.lock') }}-${{ matrix.runner }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Build Linux (x86_64)
        if: matrix.platform == 'linux-x86_64'
        run: bun run build:linux-x64

      - name: Build Linux (aarch64)
        if: matrix.platform == 'linux-aarch64'
        run: bun run build:linux-arm64

      - name: Build Darwin (x86_64)
        if: matrix.platform == 'macos-x86_64'
        run: bun run build:darwin-x64

      - name: Build Darwin (arm64)
        if: matrix.platform == 'macos-arm64'
        run: bun run build:darwin-arm64

      - name: Build (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: bun run build:windows-x64

      - name: Upload artifact for windows-x86_64
        if: matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: packages/core/dist/kulala-core-windows-x86_64.exe
          path: packages/core/dist/kulala-core-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload artifact for linux-x86_64
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: packages/core/dist/kulala-core-linux-x86_64
          path: packages/core/dist/kulala-core-linux-x86_64
          if-no-files-found: error

      - name: Upload artifact for linux-aarch64
        if: matrix.platform == 'linux-aarch64'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: packages/core/dist/kulala-core-linux-aarch64
          path: packages/core/dist/kulala-core-linux-aarch64
          if-no-files-found: error

      - name: Upload artifact for darwin-x86_64
        if: matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: packages/core/dist/kulala-core-darwin-x86_64
          path: packages/core/dist/kulala-core-darwin-x86_64
          if-no-files-found: error

      - name: Upload artifact for darwin-arm64
        if: matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: packages/core/dist/kulala-core-darwin-arm64
          path: packages/core/dist/kulala-core-darwin-arm64
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          path: packages/core/dist
          merge-multiple: true

      - name: Set version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $(find packages/core/dist -type f | wc -l) -eq 5 ]] then
            echo "Creating release with binaries"
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              packages/core/dist/kulala-core-*
          else
            echo "No build artifacts found, exiting without creating release"
            exit 1
          fi
