---
name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: >-
          PR number to test (use for fork PRs).
          Leave empty to test the branch selected above.
        required: false
        type: string

concurrency:
  group: tests-${{ inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Check user permission
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data: permission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(permission.permission)) {
              core.setFailed(
                'Only collaborators with write access can run this workflow.'
              );
            }

      - name: Resolve checkout ref
        id: resolve
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let ref;
            if (context.eventName === 'push') {
              ref = context.sha;
            } else {
              const prNumber = '${{ inputs.pull_request_number }}'.trim();
              if (prNumber) {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(prNumber)
                });
                ref = pr.head.sha;
              } else {
                ref = context.ref.replace('refs/', '');
              }
            }
            core.setOutput('ref', ref);

  lint:
    needs: resolve
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache Bun
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}-lint

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    needs: resolve
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache Bun
        uses: actions/cache@v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}-test

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
