# yaml-language-server: $schema=https://withsecrets.com/ws.schema.json
---
default:
  provider: local
  env:
    API_BEARER_TOKEN:
      value: "some secret token for local"
staging:
  provider: local
  env:
    API_BEARER_TOKEN:
      value: "some secret token for staging"
dev:
  provider: local
  env:
    API_BEARER_TOKEN:
      value: "some secret token for dev"
prod:
  provider: local
  env:
    API_BEARER_TOKEN:
      value: "some secret token for prod"
